<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitFuel Me - Dashboard</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: rgba(15, 23, 42, 0.78);
      --border: rgba(148, 163, 184, 0.16);
      --text: #e5eefb;
      --muted: #94a3b8;
      --primary: #22c55e;
      --primary-2: #14b8a6;
      --radius: 24px;
    }
    body {
      margin: 0; font-family: sans-serif; color: var(--text);
      background: linear-gradient(160deg, #020817 0%, #08111f 100%);
      min-height: 100vh; padding: 20px;
    }
    .glass { background: var(--panel); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
    .metric { background: rgba(2,6,23,0.3); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
    .value { font-size: 24px; font-weight: bold; color: var(--primary); }
    .meal-row { display: flex; justify-content: space-between; padding: 10px; background: rgba(2,6,23,0.2); margin-bottom: 8px; border-radius: 10px; }
    .pill { padding: 4px 10px; border-radius: 20px; font-size: 12px; background: rgba(34,197,94,0.1); color: #bbf7d0; border: 1px solid rgba(34,197,94,0.2); }
    button { background: var(--primary); border: none; padding: 10px 20px; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; margin: 5px; }
    h1, h3 { margin: 0 0 10px 0; }
  </style>
</head>
<body>
  <div class="glass">
    <h1>لوحة المتابعة اليومية 💪</h1>
    <div class="grid">
      <div class="metric"><div>السعرات</div><div class="value">1,620</div><small>المستهدف: 2,100</small></div>
      <div class="metric"><div>البروتين</div><div class="value">126g</div><small>المستهدف: 160g</small></div>
      <div class="metric"><div>الماء</div><div class="value">1.8L</div><small>المستهدف: 2.7L</small></div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px;">
    <div class="glass">
      <h3>سجل الوجبات 🍳</h3>
      <div class="meal-row"><span>إفطار: بيض وشوفان</span><span class="value" style="font-size:16px">480 سعرة</span></div>
      <div class="meal-row"><span>غداء: دجاج وأرز</span><span class="value" style="font-size:16px">620 سعرة</span></div>
      <button>➕ إضافة وجبة</button>
      <button style="background:#14b8a6">📷 مسح باركود</button>
    </div>

    <div class="glass">
      <h3>تمرين اليوم 🏋️</h3>
      <div class="meal-row"><span>Incline Press</span><span class="pill">تم</span></div>
      <div class="meal-row"><span>Chest Press</span><span class="pill">تم</span></div>
      <button style="width:100%; background:#8b5cf6">بدء حصة تمرین</button>
    </div>
  </div>
</body>
</html>
