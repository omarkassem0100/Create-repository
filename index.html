<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFuel Me - Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b1426; --card: #162238; --primary: #22c55e; --text: #f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center; margin: 0; }
        .card { background: var(--card); padding: 25px; border-radius: 24px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 16px; width: 100%; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .meal-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .value { font-size: 48px; font-weight: bold; color: var(--primary); margin: 10px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin-top:0">سعرات اليوم 🔥</h2>
        <div id="totalCals" class="value">0</div>
        <p style="opacity:0.6; margin-bottom:0">إجمالي السعرات المسجلة</p>
    </div>

    <div class="card">
        <h3 style="margin-top:0">الوجبات المسجلة 🥗</h3>
        <div id="list" style="text-align: right; min-height: 50px;"></div>
        <br>
        <button class="btn" onclick="addMeal()">➕ تسجيل وجبة جديدة</button>
    </div>

    <script>
        // تم وضع بياناتك هنا بنجاح ✅
        const SB_URL = 'https://ehusgtwgnkiezzchgozr.supabase.co'; 
        const SB_KEY = 'sb_publishable_KJR6jWmiVLNd8BS7l3tfMw__E0nXzq0';
        
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function getMeals() {
            const { data, error } = await supabaseClient.from('meals').select('*').order('created_at', { ascending: false });
            if (data) {
                let total = 0;
                document.getElementById('list').innerHTML = data.map(m => {
                    total += m.calories;
                    return `<div class="meal-row"><span>${m.name}</span><b>${m.calories} سعرة</b></div>`;
                }).join('');
                document.getElementById('totalCals').innerText = total;
            }
        }

        async function addMeal() {
            const n = prompt("ماذا أكلتِ؟");
            const c = parseInt(prompt("كم سعرة حرارية تقريباً؟"));
            
            if (n && c) {
                const { error } = await supabaseClient.from('meals').insert([{ name: n, calories: c }]);
                if (error) {
                    alert("حدث خطأ، تأكدي من إنشاء الجدول في Supabase");
                } else {
                    getMeals();
                }
            }
        }

        // تشغيل التطبيق فور فتحه
        getMeals();
    </script>
</body>
</html>
